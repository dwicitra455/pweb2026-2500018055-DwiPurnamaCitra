<!DOCTYPE html>
<html>
<head>
    <title>Tugas Superscript dan Subscript</title>
</head>

<body>

    <h1>Belajar Tag Superscript dan Subscript</h1>

    <p>
        Contoh rumus matematika:
        (x<sub>1</sub> + x<sub>2</sub>)<sup>2</sup>
        =
        x<sub>1</sub><sup>2</sup>
        +
        x<sub>2</sub><sup>2</sup>
        +
        2x<sub>1</sub>x<sub>2</sub>
    </p>

    <p>
        Contoh rumus kimia:
        2H<sub>2</sub> + O<sub>2</sub>
        =
        2H<sub>2</sub>O
    </p>

    <p>
        Contoh tambahan:
        10<sup>3</sup> = 1000
    </p>

    <p>
        Air memiliki rumus H<sub>2</sub>O.
    </p>

</body>
</html>
