<HTML>
<HEAD>
<TITLE>Evaluasi Nilai Huruf</TITLE>
</HEAD>

<BODY>

<SCRIPT LANGUAGE="JavaScript">

<!--

var nilai = prompt("Masukkan Nilai (0-100): ", 0);

var hasil;

if (nilai >= 80 && nilai <= 100)
{
    hasil = "A";
}
else if (nilai >= 65 && nilai <= 79)
{
    hasil = "B";
}
else if (nilai >= 40 && nilai <= 64)
{
    hasil = "C";
}
else if (nilai >= 21 && nilai <= 39)
{
    hasil = "D";
}
else if (nilai >= 0 && nilai <= 20)
{
    hasil = "E";
}
else
{
    hasil = "Nilai tidak valid";
}

document.write("Nilai Huruf : " + hasil);

//-->

</SCRIPT>

</BODY>
</HTML>
